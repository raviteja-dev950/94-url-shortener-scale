spring.application.name=94-url-shortener-scale
server.port=${PORT\:8096}\n
spring.datasource.url=jdbc\:h2\:mem\:urldb\n
spring.datasource.username=sa\n
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update\n
spring.jpa.show-sql=true\n
spring.h2.console.enabled=true\n
spring.h2.console.path=/h2-console\n
spring.cache.type=caffeine\n
spring.cache.caffeine.spec=maximumSize\=1000,expireAfterAccess\=600\n
